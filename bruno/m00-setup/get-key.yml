info:
  name: Read key
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/kv/:key"
  params:
    - name: key
      value: greeting
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("returns the stored value with a TTL", function () {
          expect(res.body.value).to.equal("hello from bruno");
          expect(res.body.ttlSeconds).to.be.within(1, 60);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Send this a few times and watch `ttlSeconds` count down. After 60 seconds it returns `404`.
