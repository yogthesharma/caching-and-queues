info:
  name: Read missing key (404)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/kv/:key"
  params:
    - name: key
      value: does-not-exist
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
