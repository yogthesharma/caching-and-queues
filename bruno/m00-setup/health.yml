info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("both Redis instances are up", function () {
          expect(res.body.redisCache).to.equal("up");
          expect(res.body.redisQueue).to.equal("up");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Pings `redis-cache` and `redis-queue`. `200` when both are up, `503` otherwise.

  Try `docker compose stop redis-queue`, send again, then `docker compose start redis-queue`.
