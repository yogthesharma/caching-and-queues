info:
  name: Read missing product (404)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/products/:id"
  params:
    - name: id
      value: "999"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Always `X-Cache: MISS` — "not found" isn't cached, so every request for this id hits the database.
  Module 3 fixes that with negative caching.
