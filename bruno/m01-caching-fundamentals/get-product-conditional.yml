info:
  name: Conditional read (304)
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/products/:id"
  params:
    - name: id
      value: "1"
      type: path
  headers:
    - name: If-None-Match
      value: "{{productEtag}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "304"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Sends back the ETag from "Read product". The product hasn't changed, so the server answers `304 Not Modified`
  with an empty body. The server still looked the product up — 304 saves bandwidth, not server work.
