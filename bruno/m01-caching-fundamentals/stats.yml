info:
  name: Stats
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/stats"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Hit/miss counters and database query count for this process. Reset when the app restarts.
