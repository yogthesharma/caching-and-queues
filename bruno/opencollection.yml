opencollection: 1.0.0

info:
  name: caching-and-queues
  version: "1"

docs:
  content: |-
    API requests for every module app under `apps/`. One folder per module.

    Select the **local** environment, start the module's app (`npm run dev` in `apps/<module>`), then send requests.
    Right-click a folder → **Run** to execute all of its requests and checks in order.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
